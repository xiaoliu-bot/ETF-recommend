name: ETF 看板每日自动更新

on:
  schedule:
    # 北京时间：午盘收盘后 11:35 / 15:00 收盘后 15:05  ->  UTC 03:35 / 07:05（周一至周五）
    # 说明：GitHub 定时任务在网络高峰可能延迟数小时，真正的“准点”由 WorkBuddy 自动化
    #       在 11:35 / 15:05 准时调用 workflow_dispatch 保证；此处 crontab 仅作兜底备份。
    - cron: "35 3 * * 1-5"
    - cron: "5 7 * * 1-5"
  workflow_dispatch:   # 允许在 Actions 页面手动触发，也允许外部 API 精准触发

permissions:
  contents: write

# 防止同一时间多个更新任务并发推送造成冲突
concurrency:
  group: etf-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取板块新闻（尽力而为，失败不阻断）
        continue-on-error: true
        run: python scripts/news_fetch.py || true

      - name: 更新 ETF 信号快照（拉行情->算指标->打分->落盘）
        run: python scripts/update.py || python scripts/update.py
        # 首跑失败自动重试一次，应对 runner 偶发网络抖动

      - name: 提交并推送到 main（触发 Pages 重建）
        run: |
          git config user.name "etf-bot"
          git config user.email "bot@local"
          git add data/ scripts/ .nojekyll README.md start_server.bat index.html splash-donate.js donate.html assets/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: ETF 信号更新 $(TZ=Asia/Shanghai date +%F_%H%M%S)"
            git push
          fi
